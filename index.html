<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundSearch</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <h1 id="logo">SoundSearch</h1>
    </header>

    <main>
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Buscar música, álbum ou artista...">
            <select id="typeFilter">
                <option value="song">Música</option>
                <option value="album">Álbum</option>
                <option value="musicArtist">Artista</option>
            </select>
            <select id="explicitFilter">
                <option value="Yes">Explícito: Sim</option>
                <option value="No" selected>Explícito: Não</option>
            </select>
            <button id="searchBtn">Buscar</button>
        </section>

        <section id="homeView" class="home-hero">
            <div class="hero-content">
                <h2>Descubra novos artistas</h2>
                <p>O SoundSearch ajuda você a encontrar músicas e sugerir para a nossa rádio universitária.</p>
                <small>Use a barra de busca acima para começar.</small>
            </div>
        </section>

        <div id="searchView" class="content-container" style="display: none;">
            <section class="results-section" id="resultsContainer"></section>

            <aside class="playlist-section">
                <h2>Minha Playlist</h2>
                <div id="playlistContainer"></div>
            </aside>
        </div>
    </main>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modalBody" class="modal-layout"></div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="playlist.js"></script>
    <script src="app.js"></script>
</body>
</html>
